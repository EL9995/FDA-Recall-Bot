<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telegram Bot Simulator</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
  /* Simulates the Telegram chat using the real bot logic (core.js). Nothing is sent anywhere. */
  :root { --bg: #9bbcd6; --me: #e1fec6; --bot: #ffffff; --ink: #111; --muted: #5b6475; --panel: #f4f6fa; --line: #d5dce8; --accent: #2e55e6; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--panel); }
  .layout { display: flex; gap: 20px; justify-content: center; padding: 20px 16px; flex-wrap: wrap; }
  .phone { width: 390px; max-width: 100%; height: 760px; max-height: calc(100vh - 40px); display: flex; flex-direction: column; border-radius: 28px; overflow: hidden; border: 8px solid #111; background: var(--bg); }
  .top { background: #fff; padding: 12px 16px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .top small { font-weight: 400; color: var(--muted); }
  .chat { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 8px; }
  .chat > * { flex-shrink: 0; }
  .msg { max-width: 82%; padding: 8px 12px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
  .msg.bot { background: var(--bot); align-self: flex-start; border-top-left-radius: 4px; }
  .msg.me { background: var(--me); align-self: flex-end; border-top-right-radius: 4px; }
  .sys { align-self: center; font-size: 12px; color: #fff; background: rgba(0,0,0,.25); padding: 2px 10px; border-radius: 10px; }
  .msg a { color: #168acd; }
  .album { align-self: flex-start; max-width: 82%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; border-radius: 14px; overflow: hidden; background: #fff; }
  .album figure { margin: 0; position: relative; }
  .album img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff; display: block; }
  .album figcaption { font-size: 11px; padding: 4px 6px; white-space: pre-wrap; color: var(--muted); }
  .inline { align-self: flex-start; max-width: 82%; display: block; text-align: center; background: rgba(0,0,0,.18); color: #fff; font-weight: 600; font-size: 13px; text-decoration: none; padding: 7px 12px; border-radius: 10px; margin-top: -4px; }
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px; background: #f0f2f5; min-height: 0; }
  .quick:empty { display: none; }
  .quick button { border: 0; color: var(--ink); background: #fff; border-radius: 8px; padding: 9px 8px; font: 500 13px inherit; cursor: pointer; box-shadow: 0 1px 1px rgba(0,0,0,.12); }
  form { display: flex; gap: 6px; padding: 8px; background: #fff; }
  form input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 18px; padding: 8px 12px; font: inherit; }
  form button { border: 0; background: #2ea6e0; color: #fff; border-radius: 18px; padding: 0 14px; font-weight: 700; cursor: pointer; }
  .panel { width: 340px; max-width: 100%; }
  .panel h1 { font-size: 20px; margin: 0 0 6px; }
  .panel p { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .panel .btn { display: block; width: 100%; text-align: left; margin-bottom: 8px; padding: 10px 12px; border: 1px solid var(--line); background: #fff; border-radius: 10px; font: 600 14px inherit; cursor: pointer; }
  .panel .btn small { display: block; font-weight: 400; color: var(--muted); }
  pre { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 12px; overflow: auto; max-height: 220px; }
</style>
</head>
<body>
<div class="layout">
  <div class="phone">
    <div class="top">FDA Recall Bot <small>Telegram bot · simulator</small></div>
    <div class="chat" id="chat"><div class="sys">Tap "Start the bot" to begin →</div></div>
    <div class="quick" id="quick"></div>
    <form id="f"><input id="t" placeholder="Type a message" autocomplete="off"><button>Send</button></form>
  </div>
  <div class="panel">
    <h1>Telegram bot simulator</h1>
    <p>Runs the real bot logic against the live recall data. Nothing is sent and nothing is saved.</p>
    <button class="btn" id="follow">Start the bot<small>What someone sees after opening the bot and tapping Start</small></button>
    <button class="btn" id="monday">Run the Monday report<small>The weekly push, replaying the most recent Monday 10 am ET</small></button>
    <button class="btn" id="daily">Run the morning check<small>"New recalls only" subscribers get a message only if something new arrived</small></button>
    <button class="btn" id="reset">Reset<small>Forget this test subscriber</small></button>
    <p style="margin-top:14px">What the bot stores for this person:</p>
    <pre id="state">nothing</pre>
  </div>
</div>

<script type="module">
import { onFollow, onText, scheduled, esc } from './core.js';

const $ = (s) => document.querySelector(s);
let user = null;
let data = null;
const ID = 'U-test';

async function getData() {
  if (!data) data = await fetch('../data/recalls.json', { cache: 'no-cache' }).then((r) => r.json());
  return data;
}

function show(state) { $('#state').textContent = state ? JSON.stringify(state, null, 2) : 'nothing (deleted)'; }

function add(html) { const c = $('#chat'); c.insertAdjacentHTML('beforeend', html); c.scrollTop = c.scrollHeight; }

// Telegram rendering: HTML text (core.js escapes everything it didn't write), photo albums,
// an inline link button under a message, and the reply keyboard (an empty list removes it).
function render(messages, from = 'bot') {
  for (const m of messages) {
    if (m.type === 'text') {
      add(`<div class="msg ${from}">${m.html.replace(/<a /g, '<a target="_blank" rel="noopener" ')}</div>`);
      if (m.link) add(`<a class="inline" href="${esc(m.link.url)}" target="_blank" rel="noopener">${esc(m.link.label)} ↗</a>`);
      if (m.buttons) $('#t').placeholder = m.placeholder || 'Type a message';
      if (m.buttons) $('#quick').innerHTML = m.buttons.map((l) => `<button type="button" data-t="${esc(l)}">${esc(l)}</button>`).join('');
    }
    if (m.type === 'album') {
      add(`<div class="album">${m.items.map((i) => `<figure><img src="${esc(i.thumb || i.photo)}" alt=""><figcaption>${esc(i.caption)}</figcaption></figure>`).join('')}</div>`);
    }
  }
}

async function say(t) {
  if (!t.trim()) return;
  render([{ type: 'text', html: esc(t) }], 'me');
  const ready = !!user;
  const r = onText(user, t, { now: new Date().toISOString(), data: ready ? await getData() : null });
  user = r.user; show(user); render(r.messages);
}

function lastMonday() {
  const d = new Date(); d.setUTCHours(14, 0, 0, 0);
  while (d.getUTCDay() !== 1) d.setUTCDate(d.getUTCDate() - 1);
  return d.toISOString();
}

async function runScheduled(now, label) {
  if (!user) { add('<div class="sys">No subscriber yet</div>'); return; }
  const sends = scheduled([[ID, user]], await getData(), now);
  add(`<div class="sys">${esc(label)}</div>`);
  if (!sends.length) { add(`<div class="sys">Nothing sent${user.step !== 'done' ? ' (signup not finished)' : ''}</div>`); return; }
  user = sends[0].user; show(user); render(sends[0].messages);
}

$('#quick').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) say(b.dataset.t); });
$('#f').addEventListener('submit', (e) => { e.preventDefault(); const t = $('#t').value; $('#t').value = ''; say(t); });
$('#follow').addEventListener('click', () => { add('<div class="msg me">/start</div>'); $('#quick').innerHTML = ''; const r = onFollow(new Date().toISOString()); user = r.user; show(user); render(r.messages); });
$('#monday').addEventListener('click', () => runScheduled(lastMonday(), 'Monday 10 am ET: weekly report run (replaying the most recent Monday)'));
$('#daily').addEventListener('click', () => {
  // Pretend the last report was 3 days ago so recent recalls count as new.
  if (user) user = { ...user, lastSent: new Date(Date.now() - 3 * 864e5).toISOString() };
  runScheduled(new Date().toISOString(), 'Morning 10 am ET check (last message 3 days ago)');
});
$('#reset').addEventListener('click', () => { user = null; show(null); $('#chat').innerHTML = '<div class="sys">Reset. Tap "Start the bot" to begin →</div>'; $('#quick').innerHTML = ''; });
</script>
</body>
</html>

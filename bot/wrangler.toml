# Cloudflare Worker settings for the Telegram bot (free plan). See bot/SETUP.md.
name = "fda-recall-bot"
main = "worker.js"
compatibility_date = "2026-09-01"

# Every day at 14:00 UTC (10 am Eastern, 7 am Pacific). Weekly reports go out on Mondays.
[triggers]
crons = ["0 14 * * *"]

# Subscriber settings: the Workers KV namespace ID (an ID, not a secret).
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "9f83adbcc07e4ab9b871056869299391"

# Deploys the Telegram bot (bot/) to Cloudflare Workers when its files change, then points
# Telegram's webhook at it. See bot/SETUP.md.
# Needs three repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, TELEGRAM_BOT_TOKEN.
name: Deploy Telegram bot

on:
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/deploy-bot.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stop if the secrets aren't set yet
        id: ready
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$CF" ] || [ -z "$TG" ]; then
            echo "Cloudflare or Telegram secrets missing; skipping deploy (see bot/SETUP.md)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: cloudflare/wrangler-action@v3
        id: deploy
        if: steps.ready.outputs.go == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bot
          secrets: |
            TELEGRAM_BOT_TOKEN
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - name: Point Telegram at the Worker
        if: steps.ready.outputs.go == 'true'
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          # Same derivation as webhookSecret() in bot/worker.js
          SECRET=$(printf 'webhook:%s' "$TG" | sha256sum | cut -d' ' -f1)
          api() { curl -sS --fail-with-body "https://api.telegram.org/bot$TG/$1" -H 'Content-Type: application/json' -d "$2"; echo; }
          api setWebhook "{\"url\":\"${URL%/}/telegram\",\"secret_token\":\"$SECRET\",\"allowed_updates\":[\"message\",\"my_chat_member\"],\"drop_pending_updates\":true}"
          api setMyCommands '{"commands":[{"command":"start","description":"Sign up or change settings"},{"command":"report","description":"Latest report"},{"command":"help","description":"What I do"},{"command":"stop","description":"Unsubscribe and delete your settings"}]}'
          api setMyShortDescription '{"short_description":"FDA recall reports, daily or weekly. Type any food or brand to check it for recalls."}'
          api setMyDescription '{"description":"Daily or weekly reports of new FDA recalls, with FDA product photos. Pick groceries, pet food, supplements, baby food, cosmetics, or drugs and devices. Facts straight from FDA.gov."}'
